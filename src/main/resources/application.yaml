spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/careerforge?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: root
    password: clx740329
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: careerforge-mysql
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  application:
    name: CareerForge-AI
  ai:
    chat:
      client:
        enabled: ${SPRING_AI_CAREER_COACH_ENABLED:false}
    model:
      chat: ${SPRING_AI_CHAT_MODEL:none}
    deepseek:
      base-url: ${AI_MODEL_BASE_URL}
      api-key: ${AI_MODEL_API_KEY}
      chat:
        model: ${AI_MODEL_NAME}
    mcp:
      server:
        enabled: false
        protocol: STREAMABLE
        type: SYNC
        tool-callback-converter: false
        expose-mcp-client-tools: false
        annotation-scanner:
          enabled: false
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        request-timeout: 12s
        resource-change-notification: false
        prompt-change-notification: false
        tool-change-notification: false
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_READ_TIMEOUT:1s}
      repositories:
        enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
careerforge:
  actor:
    fixed-id: ${CAREERFORGE_ACTOR_ID:actor-dev}
  persistence:
    enabled: ${CAREERFORGE_PERSISTENCE_ENABLED:true}
  model:
    base-url: ${AI_MODEL_BASE_URL}
    api-key: ${AI_MODEL_API_KEY}
    name: ${AI_MODEL_NAME}
  model-call-bulkhead:
    max-concurrent-calls: ${MODEL_MAX_CONCURRENT_CALLS:4}
  model-reliability:
    max-attempts: ${MODEL_RETRY_MAX_ATTEMPTS:3}
    initial-backoff: ${MODEL_RETRY_INITIAL_BACKOFF:200ms}
    max-backoff: ${MODEL_RETRY_MAX_BACKOFF:2s}
    backoff-multiplier: ${MODEL_RETRY_BACKOFF_MULTIPLIER:2.0}
    max-retry-after: ${MODEL_MAX_RETRY_AFTER:10s}
    circuit-window-size: ${MODEL_CIRCUIT_WINDOW_SIZE:10}
    circuit-minimum-calls: ${MODEL_CIRCUIT_MINIMUM_CALLS:5}
    circuit-failure-rate-threshold: ${MODEL_CIRCUIT_FAILURE_RATE_THRESHOLD:50}
    circuit-open-duration: ${MODEL_CIRCUIT_OPEN_DURATION:15s}
    circuit-half-open-permitted-calls: ${MODEL_CIRCUIT_HALF_OPEN_CALLS:2}
  embedding:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
      dimensions: ${OLLAMA_EMBEDDING_DIMENSIONS:1024}
  # 面经/岗位JD 文档配置
  knowledge:
    source:
      knowledge-base-id: careerforge-career-materials
      root-directory: ${KNOWLEDGE_SOURCE_ROOT:/Users/zhengsmacbook/Desktop/AI 应用开发/AI应用开发/文档/AI应用开发}
      documents:
        - document-id: ai-job-jd-summary
          document-name: AI应用开发_岗位JD汇总.md
          document-type: JOB_DESCRIPTION
          relative-path: AI应用开发_岗位JD汇总.md
        - document-id: ai-interview-summary
          document-name: AI应用开发_面经汇总.md
          document-type: INTERVIEW_EXPERIENCE
          relative-path: AI应用开发_面经汇总.md
    chunking:
      max-chunk-chars: ${RAG_CHUNK_MAX_CHARS:1000}
      overlap-chars: ${RAG_CHUNK_OVERLAP_CHARS:120}
    elasticsearch:
      index-alias: ${RAG_INDEX_ALIAS:careerforge-knowledge}
      index-version: ${RAG_INDEX_VERSION:v1}
    query:
      candidate-top-k: ${RAG_CANDIDATE_TOP_K:5}
      num-candidates: ${RAG_NUM_CANDIDATES:50}
      final-top-k: ${RAG_FINAL_TOP_K:5}
      rerank-enabled: ${RAG_RERANK_ENABLED:false}
      max-content-chars: ${RAG_MAX_CONTENT_CHARS:3000}
  redis:
    namespace: ${CAREERFORGE_REDIS_NAMESPACE:careerforge}
    environment: ${CAREERFORGE_REDIS_ENVIRONMENT:local}
    event-ttl: ${CAREERFORGE_REDIS_EVENT_TTL:30m}
    event-stream-max-length: ${CAREERFORGE_REDIS_EVENT_STREAM_MAX_LENGTH:500}
  agent:
    loop:
      max-model-iterations: ${AGENT_MAX_MODEL_ITERATIONS:6}
      max-total-tool-calls: ${AGENT_MAX_TOTAL_TOOL_CALLS:8}
      max-calls-per-tool: ${AGENT_MAX_CALLS_PER_TOOL:4}
      max-repeated-call-count: ${AGENT_MAX_REPEATED_CALL_COUNT:2}
      max-total-tokens: ${AGENT_MAX_TOTAL_TOKENS:20000}
      max-output-tokens-per-model-call: ${AGENT_MAX_OUTPUT_TOKENS_PER_MODEL_CALL:2000}
      max-message-history-chars: ${AGENT_MAX_MESSAGE_HISTORY_CHARS:80000}
      total-timeout: ${AGENT_TOTAL_TIMEOUT:60s}
      model-call-timeout: ${AGENT_MODEL_CALL_TIMEOUT:30s}
      tool-executor-threads: ${AGENT_TOOL_EXECUTOR_THREADS:8}
      tool-executor-queue-capacity: ${AGENT_TOOL_EXECUTOR_QUEUE_CAPACITY:32}
    run:
      max-concurrent-runs: ${COACHING_RUN_MAX_CONCURRENT:8}
      max-concurrent-runs-per-owner: ${COACHING_RUN_MAX_CONCURRENT_PER_OWNER:2}
      shutdown-grace-period: ${COACHING_RUN_SHUTDOWN_GRACE_PERIOD:20s}
      execution-timeout: ${COACHING_RUN_EXECUTION_TIMEOUT:90s}
    spring-ai:
      enabled: ${SPRING_AI_CAREER_COACH_ENABLED:false}
    run-rate-limit:
      max-requests: ${COACHING_RUN_RATE_LIMIT_MAX_REQUESTS:10}
      window: ${COACHING_RUN_RATE_LIMIT_WINDOW:1m}
server:
  port: 8080
# springdoc-openapi 项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html          # Swagger UI 访问路径
    tags-sorter: alpha              # 标签按字母顺序排序
    operations-sorter: alpha        # 操作按字母顺序排序
  api-docs:
    path: /v3/api-docs              # OpenAPI 文档访问路径

# ===== Knife4j 配置（4.x 无需 @EnableKnife4j 注解）=====
knife4j:
  enable: true
  openapi: # 纯 yaml 设置标题/版本，免写 OpenAPI @Bean
    title: CareerForge-AI 接口文档
    description: 职业锻造 AI 后端 API
    version: 1.0.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.leo.careerforgeai.model.api
          - com.leo.careerforgeai.career.api
          - com.leo.careerforgeai.knowledge.api
          - com.leo.careerforgeai.agent.api